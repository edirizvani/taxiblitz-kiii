# Headless Service (no cluster IP): gives every StatefulSet pod a stable DNS name,
# e.g. mssql-0.mssql.taxiblitz.svc.cluster.local, which the web app connects to.
apiVersion: v1
kind: Service
metadata:
  name: mssql
  labels:
    app.kubernetes.io/name: mssql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mssql
  ports:
    - name: tds
      port: 1433
      targetPort: tds
