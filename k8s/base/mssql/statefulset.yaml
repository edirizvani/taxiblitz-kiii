apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  labels:
    app.kubernetes.io/name: mssql
    app.kubernetes.io/component: database
spec:
  serviceName: mssql              # the headless Service that owns the pod DNS names
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mssql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mssql
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 60     # let SQL Server checkpoint and shut down cleanly
      securityContext:
        runAsUser: 10001                    # "mssql" user of the official image
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: tds
              containerPort: 1433
          envFrom:
            - configMapRef:
                name: mssql-config
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
          startupProbe:
            tcpSocket: { port: tds }
            periodSeconds: 5
            failureThreshold: 36            # up to 3 minutes for the first start
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: tds }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: config
              mountPath: /var/opt/mssql/mssql.conf
              subPath: mssql.conf
      volumes:
        - name: config
          configMap:
            name: mssql-config
            items:
              - key: mssql.conf
                path: mssql.conf
  # one PersistentVolumeClaim per pod (data-mssql-0), kept when the pod is deleted
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mssql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
