apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxiblitz-web
  labels:
    app.kubernetes.io/name: taxiblitz-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: taxiblitz-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # never drop below 2 serving pods during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxiblitz-web
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654          # "app" user of the mcr.microsoft.com/dotnet/aspnet image
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        # keep replicas on one node: the uploads volume is ReadWriteOnce
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: taxiblitz-web
              topologyKey: kubernetes.io/hostname
      initContainers:
        # 1) wait until SQL Server accepts connections (app migrates the DB on start)
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z -w 2 mssql-0.mssql 1433; do echo waiting for mssql; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
        # 2) seed the uploads volume with the images baked into the image (first start only)
        - name: seed-uploads
          image: edirizvani/taxiblitz-web
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /uploads/gallery /uploads/profile-pics && cp -rn /app/wwwroot/gallery/. /uploads/gallery/"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: uploads
              mountPath: /uploads
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      containers:
        - name: web
          image: edirizvani/taxiblitz-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          startupProbe:                      # migrations can take a while on first start
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:                    # receive traffic only when DB + Redis are reachable
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                     # restart the container if the process hangs
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: uploads
              mountPath: /app/wwwroot/gallery
              subPath: gallery
            - name: uploads
              mountPath: /app/wwwroot/profile-pics
              subPath: profile-pics
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: web-uploads
        - name: tmp
          emptyDir: {}
