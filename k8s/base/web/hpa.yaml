# Scale the web tier between 2 and 4 pods on CPU (metrics-server ships with k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taxiblitz-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taxiblitz-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
