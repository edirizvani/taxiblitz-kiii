apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  labels:
    app.kubernetes.io/name: taxiblitz-web
type: Opaque
stringData:
  # mssql-0.mssql = stable DNS name of the StatefulSet pod behind the headless Service
  ConnectionStrings__DefaultConnection: "Server=mssql-0.mssql,1433;Database=TaxiBlitzOhrid;User Id=sa;Password=ChangeMe_Strong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
  AdminSeedPassword: "Admin_ChangeMe1!"
  SmtpUser: "taxiblitz"                 # Mailpit accepts any credentials
  SmtpPass: "mailpit"
  OpenWeatherApiKey: ""
  GoogleClientId: ""
  GoogleClientSecret: ""
