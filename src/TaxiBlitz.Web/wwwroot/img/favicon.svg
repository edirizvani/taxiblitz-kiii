<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg  { fill: #0B100E }
    .ring{ fill: none; stroke: #67E8F9; stroke-width: 10 }
    .dot { fill: #67E8F9 }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #F0F4F2 }
      .ring{ stroke: #0891B2 }
      .dot { fill: #0891B2 }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="22"/>
  <circle class="ring" cx="50" cy="50" r="34"/>
  <circle class="dot"  cx="50" cy="50" r="9"/>
</svg>
